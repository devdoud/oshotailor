name: osho
description: "A new Flutter project."


publish_to: 'none' 




version: 1.0.0+1

environment:
  sdk: ^3.6.0



dependencies:
  flutter:
    sdk: flutter

  # Utilities
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  flutter_native_splash: ^2.4.6

  # State, storage, backend
  get: ^4.7.2
  get_storage: ^2.1.1
  supabase_flutter: ^2.8.3

  # Notifications
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^17.2.4

  # UI
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  
  
  
  
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4





flutter:
  uses-material-design: true

  #--------- LOCAL ASSSETS -----------#
  assets:
    - assets/images/on_boarding_images/
    - assets/images/store/

  #-------- LOCAL FONTS -------------#
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/dmsans/dmsans-400.ttf
          weight: 400
        - asset: assets/fonts/dmsans/dmsans-500.ttf
          weight: 500
        - asset: assets/fonts/dmsans/dmsans-600.ttf
          weight: 600
    # Fraunces, coupe optique 72 pt, pour les titres et les prix uniquement.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces/fraunces-400.ttf
          weight: 400
        - asset: assets/fonts/fraunces/fraunces-600.ttf
          weight: 600
